version: 1.0

build:
  # This section tells App Runner to build the image using a Dockerfile.
  # It is technically optional if your Dockerfile is at the root,
  # but being explicit is a best practice.
  type: docker
  docker:
    file: ./Dockerfile

run:
  # The command to start the application.
  # We run migrations first, then start the server.
  # This is a best practice for production deployments.
  command: pnpm payload migrate && pnpm start
  # The port your application listens on, as defined in your Dockerfile.
  port: 3000